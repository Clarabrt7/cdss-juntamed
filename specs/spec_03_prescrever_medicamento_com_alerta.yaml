funcao: prescrever_medicamento_com_alerta
ator: medico assistente pelo modulo de prescricao
entrada:
  hadm_id: inteiro, obrigatorio
  num_registro: texto de 13 digitos, obrigatorio (catalogo ANVISA)
  posologia: texto, obrigatorio
le: MEDICAMENTO (num_registro, categoria_risco_renal) e EXAME_CLINICO (ultimo valuenum de creatinina sérica para o hadm_id)
escreve: PRESCREVE (insere 1 linha com posologia, alerta_renal e data_prescricao)
regra: o medicamento deve estar ativo na ANVISA e registrar alerta_renal quando paciente apresentar disfuncao (R8)
retorna: status_prescricao ('GRAVADA'), alerta_renal (booleano) e mensagem_orientativa
frequencia: alta, em cada round de prescricao hospitalar
transacao: >-
  verificar existencia do medicamento e do atendimento;
  bloquear para leitura o ultimo exame de creatinina do paciente (FOR SHARE);
  avaliar a compatibilidade nefrotóxica;
  inserir na tabela associativa PRESCREVE garantindo que posologia e alerta_renal sejam persistidos de forma atômica
