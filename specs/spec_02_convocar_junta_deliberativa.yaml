funcao: convocar_junta_deliberativa
ator: medico assistente ou gatilho de auditoria do CDSS
entrada:
  hadm_id: inteiro, obrigatorio
  agentes_selecionados: lista de inteiros com os id_agente (minimo 2)
  pareceres: lista de dicionarios contendo id_agente, texto_parecer, hipótese e risco
  diretrizes: lista de pares (id_agente, id_diretriz) obrigatoria
le: ATENDIMENTO (hadm_id), AGENTE_IA (id_agente) e DIRETRIZ_CLINICA (id_diretriz)
escreve: SESSAO_JUNTA (insere 1 linha), PARECER_AGENTE (insere N linhas) e FUNDAMENTA (insere N linhas)
regra: a sessao deve possuir pelo menos 2 pareceres e cada parecer deve ter diretriz oficial vinculada (R5, R6, R7)
retorna: id_sessao gerado, indice_discordancia e lista de alertas de viés cognitivo
frequencia: media, de 2 a 5 vezes por atendimento complexo
transacao: >-
  verificar existencia do atendimento; inserir o cabecalho em SESSAO_JUNTA;
  inserir sequencialmente cada PARECER_AGENTE associando ao AGENTE_IA;
  vincular cada parecer a sua DIRETRIZ_CLINICA em FUNDAMENTA;
  computar o indice_discordancia e atualizar a linha de SESSAO_JUNTA;
  se qualquer insercao falhar ou violar R7, efetuar ROLLBACK total
