funcao: listar_exames_criticos_atendimento
ator: medico intensivista, pelo painel da UTI
entrada:
  hadm_id: inteiro, obrigatorio (ex.: 20459812)
  apenas_anormais: booleano, padrao true
  limite: inteiro de 1 a 100, padrao 50
le: EXAME_CLINICO (seq_exame, item_name, valuenum, valueuom, charttime, flag_anormal) e ATENDIMENTO (hadm_id)
escreve: nada, somente leitura
regra: somente exames vinculados ao atendimento aberto e ordenados do mais recente (R4)
retorna: lista de exames com seq_exame, item_name, valuenum, unidade, charttime e flag de anormalidade
frequencia: extremamente alta, a cada atualizacao da dashboard do leito
indice: EXAME_CLINICO (hadm_id, flag_anormal, charttime DESC)
